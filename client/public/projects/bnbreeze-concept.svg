<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a202c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#grid2)" opacity="0.6"/>

  <!-- Top Metadata Bar -->
  <rect x="40" y="32" width="720" height="36" fill="#12151d" rx="4" stroke="#222734" stroke-width="1"/>
  <circle cx="60" cy="50" r="4" fill="#d6483e"/>
  <text x="76" y="54" fill="#8d95a5" font-family="monospace" font-size="11" letter-spacing="2">BNBREEZE // FULL-STACK PROPERTY DISCOVERY PLATFORM</text>
  <text x="680" y="54" fill="#d6483e" font-family="monospace" font-size="11" text-anchor="end">SYS_ID: 02-PROP</text>

  <!-- Isometric Architectural Pavilion Wireframe -->
  <g transform="translate(400, 240)">
    <!-- Base Foundation Diamond -->
    <polygon points="0,-100 180,-10 0,80 -180,-10" fill="#121620" stroke="#363e52" stroke-width="2"/>
    
    <!-- Floor Grid Lines -->
    <line x1="-90" y1="35" x2="90" y2="-55" stroke="#262d3e" stroke-width="1.5"/>
    <line x1="-90" y1="-55" x2="90" y2="35" stroke="#262d3e" stroke-width="1.5"/>

    <!-- Upright Pillars -->
    <line x1="-120" y1="0" x2="-120" y2="-90" stroke="#48536e" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="-90" stroke="#48536e" stroke-width="2"/>
    <line x1="0" y1="80" x2="0" y2="-10" stroke="#d6483e" stroke-width="2.5"/>
    <line x1="0" y1="-100" x2="0" y2="-180" stroke="#48536e" stroke-width="2"/>

    <!-- Roof Pavilion Diamond -->
    <polygon points="0,-180 180,-90 0,0 -180,-90" fill="none" stroke="#d6483e" stroke-width="2.5"/>
    
    <!-- Entrance Portal / Core Indicator -->
    <polygon points="-35,-5 35,-5 35,55 -35,55" fill="#d6483e" opacity="0.25"/>
    <rect x="-25" y="10" width="50" height="40" fill="#d6483e" opacity="0.75" rx="3"/>
    <circle cx="0" cy="30" r="6" fill="#ffffff"/>

    <!-- Map Coordinate Ring -->
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#d6483e" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <!-- Coordinates & Spatial HUD (Left) -->
  <rect x="40" y="380" width="340" height="90" fill="#0e1118" rx="6" stroke="#252a38" stroke-width="1.5"/>
  <text x="56" y="405" fill="#8d95a5" font-family="monospace" font-size="10" letter-spacing="1">SPATIAL MAP &amp; COORDINATES</text>
  <text x="56" y="425" fill="#f0ece1" font-family="monospace" font-size="11">MapTiler Integration · 22.3072° N, 73.1812° E</text>
  <text x="56" y="445" fill="#d6483e" font-family="monospace" font-size="10">Cloudinary Media Pipeline · MVC RESTful API</text>

  <!-- MVC Architecture Info (Right) -->
  <rect x="420" y="380" width="340" height="90" fill="#0e1118" rx="6" stroke="#252a38" stroke-width="1.5"/>
  <text x="438" y="405" fill="#8d95a5" font-family="monospace" font-size="10" letter-spacing="1">AUTHENTICATION &amp; VALIDATION</text>
  <text x="438" y="425" fill="#f0ece1" font-family="monospace" font-size="12" font-weight="bold">Passport.js Sessions + Joi Validation</text>
  <text x="438" y="448" fill="#8d95a5" font-family="monospace" font-size="10">Full CRUD Workflows · Centralized Error Handling</text>
</svg>