    <text x="0" y="5" fill="#f0ece1" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SHA-256</text>
    <text x="0" y="24" fill="#d6483e" font-family="monospace" font-size="9" text-anchor="middle">VERIFIED</text>

