    <rect x="-120" y="-130" width="240" height="170" rx="8" fill="#151924" stroke="#363f54" stroke-width="2"/>
    <line x1="-90" y1="-100" x2="90" y2="-100" stroke="#2a3244" stroke-width="3"/>
