  <!-- Cryptographic Details (Bottom Left) -->
  <rect x="40" y="380" width="340" height="90" fill="#0e1118" rx="6" stroke="#252a38" stroke-width="1.5"/>
  <text x="56" y="405" fill="#8d95a5" font-family="monospace" font-size="10" letter-spacing="1">CRYPTOGRAPHIC TAMPER DETECTION</text>
  <text x="56" y="425" fill="#3dd68c" font-family="monospace" font-size="11">HASH: 7f83b1657ff1fc53b92dc18148a1... OK</text>
