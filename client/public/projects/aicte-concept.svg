      <text x="-115" y="22" fill="#8d95a5" font-family="monospace" font-size="9" text-anchor="middle">BLK #1084</text>

      <line x1="-70" y1="18" x2="-45" y2="18" stroke="#d6483e" stroke-width="2"/>

      <rect x="-45" y="0" width="90" height="35" rx="4" fill="#1a1e2b" stroke="#d6483e" stroke-width="2"/>
      <text x="0" y="22" fill="#f0ece1" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">BLK #1085</text>

      <line x1="45" y1="18" x2="70" y2="18" stroke="#d6483e" stroke-width="2"/>

      <rect x="70" y="0" width="90" height="35" rx="4" fill="#141824" stroke="#363f54" stroke-width="1.5"/>
      <text x="115" y="22" fill="#8d95a5" font-family="monospace" font-size="9" text-anchor="middle">BLK #1086</text>
    </g>
