      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2230" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect width="800" height="500" fill="url(#grid3)" opacity="0.65"/>

  <!-- Top Metadata Bar -->
